name: labtest
on:
  workflow_dispatch:
    inputs:
      module:
        description: "python module to run (rm.labtest_...)"
        required: true
        default: rm.labtest_pyramid
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: rawdata-lab-${{ github.run_id }}
          restore-keys: rawdata-
      - uses: actions/cache/restore@v4
        with:
          path: data/models
          key: models-lab-${{ github.run_id }}
          restore-keys: models-
      - name: restore memory (read only)
        run: |
          mkdir -p state
          git fetch --depth 1 origin state && git --work-tree=state checkout FETCH_HEAD -- . && git reset -q || true
      - run: python -W ignore -m ${{ inputs.module }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labtest
          path: labtest.json
