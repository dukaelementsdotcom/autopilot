name: Agent Team (Research)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04 # Force newer OS that natively supports Python 3.12
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Verify Python version
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          python -m pip --version
          
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        
      - name: Run Agent Team
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ: ${{ secrets.GROQ }}
        run: python -m rm.agent_team
        
      - name: Commit new lab test
        run: |
          git config --global user.name "Agent Team"
          git config --global user.email "agent@volvox.local"
          git add rm/labtest_agent_*.py
          git commit -m "Agent Team: Generated new hypothesis" || echo "No new ideas"
          git push
